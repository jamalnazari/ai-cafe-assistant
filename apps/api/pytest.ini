[pytest]
# فقط پوشهٔ tests جمع‌آوری می‌شود تا پوشه‌های موقت/زائد کنار کد (مثل
# pytest-cache-files-*) هرگز در نتیجهٔ تست دخالت نکنند.
testpaths = tests
# pytest-asyncio: دامنهٔ حلقهٔ event برای fixtureهای async به‌صراحت تعیین می‌شود
# تا هشدار deprecation نسخه‌های آینده دیده نشود.
asyncio_default_fixture_loop_scope = function
